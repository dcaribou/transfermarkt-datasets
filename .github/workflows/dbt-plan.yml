name: Schema review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dbt-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dbt dependencies
        run: python -m pip install dbt-core==1.11.5 dbt-duckdb==1.10.0 duckdb==1.4.4
      - name: Report compiled schema changes
        uses: PresentJay/dbt-plan@d98f06e8674a1e68a009112b90d0d00c41416c33 # v0.18.5
        with:
          version: "0.18.6"
          fail-on: never
          project-dir: dbt
          compile-command: >-
            dbt deps --profiles-dir . && dbt compile --profiles-dir . --no-partial-parse
